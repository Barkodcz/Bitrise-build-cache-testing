project_type: other
step_bundles:
  collect_metrics:
    steps:
    - script@1.2.1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR/tools/metrics/timing.sh" stop total_workflow
            "$BITRISE_SOURCE_DIR"/tools/metrics/merge_fragments.py \
              --scenario "$SHOWCASE_SCENARIO_ID" --phase "$SHOWCASE_PHASE" \
              --out "$SHOWCASE_METRICS_DIR"
        title: Collect + merge showcase metrics
  deploy_metrics:
    steps:
    - deploy-to-bitrise-io@2.26.2:
        inputs:
        - pipeline_intermediate_files: $SHOWCASE_METRICS_DIR/${SHOWCASE_SCENARIO_ID}__${SHOWCASE_PHASE}.json:SHOWCASE_METRICS_DIR_${SHOWCASE_SCENARIO_ID}
  go_build:
    inputs:
    - go_version: 1.22.0
    steps:
    - script@1.2.1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/run-go.sh "$go_version"
        title: go build + test
  gradle_build:
    inputs:
    - tasks: :app:assembleDebug :core:model:testDebugUnitTest
    - options: --console=plain
    steps:
    - script@1.2.1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/run-gradle.sh "$tasks" "$options"
        title: Gradle build (instrumented with showcase metrics init script)
  gradle_build_cache:
    inputs:
    - push: "true"
    - verbose: "false"
    - validation_level: warning
    steps:
    - activate-build-cache-for-gradle@3.18.1:
        inputs:
        - push: $push
        - verbose: $verbose
        - validation_level: $validation_level
        - collect_metrics: "true"
  gradle_deps_cache_restore:
    inputs:
    - key: gradle-deps-{{ getenv "SHOWCASE_NS" }}-{{ .OS }}-{{ checksum "**/*.gradle*"
        "gradle.properties" "gradle/libs.versions.toml" }}
    steps:
    - restore-cache@3.0.2:
        inputs:
        - key: $key
        - verbose: "false"
  gradle_deps_cache_save:
    inputs:
    - key: gradle-deps-{{ getenv "SHOWCASE_NS" }}-{{ .OS }}-{{ checksum "**/*.gradle*"
        "gradle.properties" "gradle/libs.versions.toml" }}
    - paths: |-
        ~/.gradle/caches/modules-2
        ~/.gradle/wrapper
    steps:
    - save-cache@1.5.3:
        inputs:
        - key: $key
        - paths: $paths
        - is_key_unique: "true"
        - verbose: "false"
  kb_restore:
    inputs:
    - key: kb-{{ getenv "SHOWCASE_NS" }}-REPLACE_ME
    - name: cache
    steps:
    - restore-cache@3.0.2:
        inputs:
        - key: $key
        - verbose: "false"
    - script@1.2.1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/metrics/keybased_record.sh record-restore "$name" '$key'
        title: Record key-based cache restore outcome
  kb_save:
    inputs:
    - key: kb-{{ getenv "SHOWCASE_NS" }}-REPLACE_ME
    - paths: REPLACE_ME
    - is_key_unique: "true"
    - name: cache
    steps:
    - save-cache@1.5.3:
        inputs:
        - key: $key
        - paths: $paths
        - is_key_unique: $is_key_unique
        - verbose: "false"
    - script@1.2.1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/metrics/keybased_record.sh record-save "$name" '$key' '$paths'
        title: Record key-based cache save outcome
  maven_build:
    steps:
    - script@1.2.1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/run-maven.sh
        title: mvn test
  node_install:
    inputs:
    - working_dir: $BITRISE_SOURCE_DIR/projects/node
    steps:
    - script@1.2.1:
        inputs:
        - working_dir: $working_dir
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/metrics/timing.sh start dependency_install
            npm ci --prefer-offline
            "$BITRISE_SOURCE_DIR"/tools/metrics/timing.sh stop dependency_install
        title: npm ci
  python_install:
    inputs:
    - app: pip
    steps:
    - script@1.2.1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/run-python.sh "$app"
        title: pip/poetry install + test
  report:
    inputs:
    - fail_on_assertion: $SHOWCASE_FAIL_ON_ASSERTION
    steps:
    - pull-intermediate-files@1.3.7:
        inputs:
        - artifact_sources: .*
    - script@1.2.1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            # pull-intermediate-files has no "download into this dir" input: it downloads each
            # scenario's <SCENARIO>__<phase>.json into its OWN randomly-named /tmp/_artifact_pull*
            # directory and only exposes the path via a per-scenario output env var (verified
            # 2026-11-26: assertions.py reported "no measure metrics found" for every scenario on a
            # real report_node run, even though render.py's own output proved the files existed).
            # Glob for them directly instead of relying on env var names (which contain literal
            # hyphens, e.g. $SHOWCASE_METRICS_DIR_NODE-B02, so they aren't even valid bash identifiers).
            mkdir -p "$SHOWCASE_METRICS_DIR"
            shopt -s nullglob
            for d in /tmp/_artifact_pull*/; do
              cp "$d"*.json "$SHOWCASE_METRICS_DIR"/ 2>/dev/null || true
            done
            echo "Assembled metrics dir:"
            ls -la "$SHOWCASE_METRICS_DIR"
        title: Assemble metrics dir from downloaded artifacts
    - script@1.2.1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            # PyYAML isn't preinstalled on the stack (verified 2026-11-26, see verified-facts.md:
            # "ModuleNotFoundError: No module named 'yaml'" on a real report_node run).
            pip install --quiet --disable-pip-version-check pyyaml
            "$BITRISE_SOURCE_DIR"/tools/report/render.py \
              --metrics-dir "$SHOWCASE_METRICS_DIR" --catalog "$BITRISE_SOURCE_DIR/scenarios/catalog.yml" \
              --out "$BITRISE_SOURCE_DIR/.showcase/report" --stack "$SHOWCASE_STACK"
        title: Render showcase report
    - script@1.2.1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            pip install --quiet --disable-pip-version-check pyyaml
            FAIL_FLAG="false"
            if [ "$fail_on_assertion" = "true" ]; then FAIL_FLAG="true"; fi
            "$BITRISE_SOURCE_DIR"/tools/report/assertions.py \
              --metrics-dir "$SHOWCASE_METRICS_DIR" --catalog "$BITRISE_SOURCE_DIR/scenarios/catalog.yml" \
              --out "$BITRISE_SOURCE_DIR/.showcase/report" --fail-on-assertion "$FAIL_FLAG" \
              --stack "$SHOWCASE_STACK"
        title: Evaluate assertions
    - deploy-to-bitrise-io@2.26.2:
        inputs:
        - deploy_path: $BITRISE_SOURCE_DIR/.showcase/report
  ruby_install:
    inputs:
    - ruby_version: system
    steps:
    - script@1.2.1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/run-ruby.sh "$ruby_version"
        title: bundle install + smoke test
  rust_build:
    inputs:
    - toolchain: stable
    - profile: release
    steps:
    - script@1.2.1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/run-rust.sh "$toolchain" "$profile"
        title: cargo build + test
  setup_checkout:
    inputs:
    - clone_dir: $BITRISE_SOURCE_DIR
    steps:
    - git-clone@8.5.3:
        inputs:
        - clone_into_dir: $clone_dir
  setup_showcase:
    steps:
    - script@1.2.1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            source "$BITRISE_SOURCE_DIR/tools/namespace.sh"
            "$BITRISE_SOURCE_DIR/tools/metrics/timing.sh" start total_workflow
        title: Showcase setup (namespace + timers)
  simulate_change:
    inputs:
    - kind: $SHOWCASE_CHANGE_KIND
    steps:
    - script@1.2.1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR/tools/simulate-change.sh" "$SHOWCASE_STACK" "$kind"
        title: Simulate change ($kind)
  xcode_build_cache:
    inputs:
    - push: "true"
    - verbose: "false"
    steps:
    - activate-build-cache-for-xcode@1.10.1:
        inputs:
        - push: $push
        - verbose: $verbose
  xcode_build_sim:
    inputs:
    - scheme: ShowcaseiOS
    - xcconfig_content: |-
        CODE_SIGNING_ALLOWED=NO
        COMPILER_INDEX_STORE_ENABLE=NO
    steps:
    - script@1.2.1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            if ! command -v xcodegen >/dev/null 2>&1; then
              brew install xcodegen
            fi
            cd "$BITRISE_SOURCE_DIR/projects/ios"
            xcodegen generate
        title: xcodegen generate
    - xcode-build-for-simulator@3.0.3:
        inputs:
        - project_path: $BITRISE_SOURCE_DIR/projects/ios/ShowcaseiOS.xcodeproj
        - scheme: $scheme
        - xcconfig_content: $xcconfig_content
    - script@1.2.1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            echo "--- [diagnostic] xcelerate log(s) in \$BITRISE_DEPLOY_DIR ---"
            for f in "$BITRISE_DEPLOY_DIR"/xcelerate-*.log; do
              [ -e "$f" ] || continue
              echo "=== $f ==="
              cat "$f"
            done
            echo "--- [diagnostic] end xcelerate log(s) ---"
            "$BITRISE_SOURCE_DIR"/tools/metrics/xcode_parse.py \
              --raw-log "${BITRISE_XCODE_RAW_RESULT_TEXT_PATH:-}" \
              --out "$SHOWCASE_METRICS_DIR/.fragments/${SHOWCASE_SCENARIO_ID}__${SHOWCASE_PHASE}/xcode.json"
        title: Collect Xcode build-cache metrics
  xcode_build_sim_bypass:
    inputs:
    - scheme: ShowcaseiOS
    steps:
    - script@1.2.1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            if ! command -v xcodegen >/dev/null 2>&1; then
              brew install xcodegen
            fi
            cd "$BITRISE_SOURCE_DIR/projects/ios"
            xcodegen generate
        title: xcodegen generate
    - script@1.2.1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            cd "$BITRISE_SOURCE_DIR/projects/ios"
            "$BITRISE_SOURCE_DIR"/tools/metrics/timing.sh start build_step
            /usr/bin/xcodebuild build \
              -project ShowcaseiOS.xcodeproj -scheme "$scheme" \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              2>&1 | tee "$SHOWCASE_METRICS_DIR/.fragments/${SHOWCASE_SCENARIO_ID}__${SHOWCASE_PHASE}/xcodebuild-raw.log"
            "$BITRISE_SOURCE_DIR"/tools/metrics/timing.sh stop build_step
        title: xcodebuild via absolute path (bypasses any shim/alias)
    - script@1.2.1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/metrics/xcode_parse.py \
              --raw-log "$SHOWCASE_METRICS_DIR/.fragments/${SHOWCASE_SCENARIO_ID}__${SHOWCASE_PHASE}/xcodebuild-raw.log" \
              --out "$SHOWCASE_METRICS_DIR/.fragments/${SHOWCASE_SCENARIO_ID}__${SHOWCASE_PHASE}/xcode.json"
        title: Collect Xcode build-cache metrics
