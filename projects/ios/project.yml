name: ShowcaseiOS
options:
  bundleIdPrefix: com.showcase
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  ShowcaseiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.showcase.ios
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generated: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  ShowcaseiOS:
    build:
      targets:
        ShowcaseiOS: all
    test:
      targets: []
