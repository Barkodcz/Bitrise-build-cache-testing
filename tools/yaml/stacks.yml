# Logical stack/machine names (as used in scenarios/catalog.yml `stack_id` / `machine`) resolved to
# real Bitrise stack IDs + machine_type_ids in this single place (spec §7.2).
#
# machine_type_id is intentionally left unset for every entry below: it was not possible to verify
# machine type IDs for this workspace via the CLI in this pass (docs/reference/verified-facts.md).
# Leaving it unset means Bitrise uses the app/workspace default machine for that workflow.
stacks:
  linux-default:
    stack: ubuntu-noble-24.04-bitrise-2025-android
    machine_type_id: null
  xcode-26:
    # Resolved 2026-11-26: osx-xcode-latest-stable is "stable" status for this workspace and
    # currently tracks Xcode 27.x — well past the Xcode 26+ requirement for Build Cache for Xcode
    # (spec §3.4). Using "latest-stable" rather than pinning an exact 26.x point release keeps this
    # from going stale as Bitrise rolls stacks forward.
    stack: osx-xcode-latest-stable
    machine_type_id: null
  xcode-16-legacy:
    stack: osx-xcode-16.4.x
    machine_type_id: null
  macos-default:
    # Verified 2026-11-26 (docs/reference/verified-facts.md): osx-xcode-latest-stable is a real,
    # stable-status stack for this workspace — used for RB-B01's macOS measure leg, where the
    # specific Xcode version doesn't matter (no Xcode build involved), only that it's a real,
    # low-maintenance macOS stack, mirroring linux-default's ubuntu-latest-stable-adjacent choice.
    stack: osx-xcode-latest-stable
    machine_type_id: null
