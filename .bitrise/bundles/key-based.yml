# Generic key-based cache bundles (spec §3.9, §7.3) used by every key-based-caching scenario.
# Each bundle pairs the official cache step with a `keybased_record.sh` call so the scenario
# workflow itself only ever references `bundle::*` (spec §7.1's "raw step in a scenario = a smell").
# `node_install` is the npm-specific wrapper used by the Node scenarios (scenarios/catalog.yml
# NODE-*); `go_build`/`rust_build`/`python_install`/`maven_build`/`ruby_install` are the
# Go/Rust/Python/Maven/Ruby wrappers (GO-*/RS-*/PY-*/MVN-*/RB-*).
step_bundles:
  kb_restore:
    inputs:
    - key: 'kb-{{ getenv "SHOWCASE_NS" }}-REPLACE_ME'
    - name: "cache"
    steps:
    - restore-cache@3.0.2:
        inputs:
        - key: $key
        - verbose: "false"
    - script@1.2.1:
        title: "Record key-based cache restore outcome"
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/metrics/keybased_record.sh record-restore "$name" '$key'

  kb_save:
    inputs:
    - key: 'kb-{{ getenv "SHOWCASE_NS" }}-REPLACE_ME'
    - paths: "REPLACE_ME"
    - is_key_unique: "true"
    - name: "cache"
    steps:
    - save-cache@1.5.3:
        inputs:
        - key: $key
        - paths: $paths
        - is_key_unique: $is_key_unique
        - verbose: "false"
    - script@1.2.1:
        title: "Record key-based cache save outcome"
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/metrics/keybased_record.sh record-save "$name" '$key' '$paths'

  # `npm ci` against projects/node. The generator fills `restore_key`/`save_key` per-scenario
  # (NODE-B01 deliberately makes them differ) rather than this bundle hardcoding one template,
  # so the defect stays visible in the generated workflow YAML (spec §7.1).
  node_install:
    inputs:
    - working_dir: "$BITRISE_SOURCE_DIR/projects/node"
    steps:
    - script@1.2.1:
        title: "npm ci"
        inputs:
        - working_dir: $working_dir
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/metrics/timing.sh start dependency_install
            npm ci --prefer-offline
            "$BITRISE_SOURCE_DIR"/tools/metrics/timing.sh stop dependency_install

  # `go build ./... && go test ./...` against projects/go, via tools/run-go.sh (spec §6.8). Always
  # installs the pinned `go_version` from scratch (go.dev/dl) rather than relying on whatever Go
  # happens to be preinstalled on the stack — this is what makes GO-B02's toolchain-drift scenario
  # meaningful (seed and measure can genuinely run different, real Go versions).
  go_build:
    inputs:
    - go_version: "1.22.0"
    steps:
    - script@1.2.1:
        title: "go build + test"
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/run-go.sh "$go_version"

  # `cargo build && cargo test` against projects/rust, via tools/run-rust.sh (spec §6.9). Always
  # installs the pinned `toolchain` from scratch via rustup rather than relying on whatever's
  # preinstalled on the stack — this is what makes RS-B02's toolchain-drift scenario meaningful.
  rust_build:
    inputs:
    - toolchain: "stable"
    - profile: "release"
    steps:
    - script@1.2.1:
        title: "cargo build + test"
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/run-rust.sh "$toolchain" "$profile"

  # pip install -r requirements.txt / poetry install + run tests against projects/python, via
  # tools/run-python.sh (spec §6.10). Which directory gets cached (pip's download cache vs. the
  # whole .venv; poetry's cache dir) is decided entirely by the generator's kb_restore/kb_save
  # wiring per scenario, not by this bundle — see PY-G01/PY-B02's contrast.
  python_install:
    inputs:
    - app: "pip"
    steps:
    - script@1.2.1:
        title: "pip/poetry install + test"
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/run-python.sh "$app"

  # `mvn test` against projects/maven (both modules via Maven's reactor), via tools/run-maven.sh
  # (spec §6.11). Which directory gets cached (~/.m2/repository alone vs. also target/ dirs) is
  # decided entirely by the generator's kb_restore/kb_save wiring per scenario.
  maven_build:
    steps:
    - script@1.2.1:
        title: "mvn test"
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/run-maven.sh

  # `bundle install` + a smoke-test script against projects/ruby, via tools/run-ruby.sh (spec
  # §6.7). Installs the pinned `ruby_version` from scratch via rbenv (unless "system") so seed and
  # measure can genuinely run different real Ruby versions for RB-B02. RB-B01's "restored native
  # gem from the wrong OS is unusable" symptom is caught and recovered from INSIDE
  # tools/run-ruby.sh, never left to hard-fail this step (spec §0.6).
  ruby_install:
    inputs:
    - ruby_version: "system"
    steps:
    - script@1.2.1:
        title: "bundle install + smoke test"
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/run-ruby.sh "$ruby_version"
