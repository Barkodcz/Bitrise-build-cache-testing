# Generic key-based cache bundles (spec §3.9, §7.3) used by every key-based-caching scenario.
# Each bundle pairs the official cache step with a `keybased_record.sh` call so the scenario
# workflow itself only ever references `bundle::*` (spec §7.1's "raw step in a scenario = a smell").
# `node_install` is the npm-specific wrapper used by the Node scenarios (scenarios/catalog.yml
# NODE-*); `go_build`/`rust_build` are the Go/Rust wrappers (GO-*/RS-*). Ruby/Python/Maven wrappers
# are not implemented yet (status: planned) — add `ruby_install` / `python_install` / `maven_build`
# here, following the same shape, when those stacks move to `status: implemented`.
step_bundles:
  kb_restore:
    inputs:
    - key: 'kb-{{ getenv "SHOWCASE_NS" }}-REPLACE_ME'
    - name: "cache"
    steps:
    - restore-cache@3.0.2:
        inputs:
        - key: $key
        - verbose: "false"
    - script@1.2.1:
        title: "Record key-based cache restore outcome"
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/metrics/keybased_record.sh record-restore "$name" '$key'

  kb_save:
    inputs:
    - key: 'kb-{{ getenv "SHOWCASE_NS" }}-REPLACE_ME'
    - paths: "REPLACE_ME"
    - is_key_unique: "true"
    - name: "cache"
    steps:
    - save-cache@1.5.3:
        inputs:
        - key: $key
        - paths: $paths
        - is_key_unique: $is_key_unique
        - verbose: "false"
    - script@1.2.1:
        title: "Record key-based cache save outcome"
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/metrics/keybased_record.sh record-save "$name" '$key' '$paths'

  # `npm ci` against projects/node. The generator fills `restore_key`/`save_key` per-scenario
  # (NODE-B01 deliberately makes them differ) rather than this bundle hardcoding one template,
  # so the defect stays visible in the generated workflow YAML (spec §7.1).
  node_install:
    inputs:
    - working_dir: "$BITRISE_SOURCE_DIR/projects/node"
    steps:
    - script@1.2.1:
        title: "npm ci"
        inputs:
        - working_dir: $working_dir
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/metrics/timing.sh start dependency_install
            npm ci --prefer-offline
            "$BITRISE_SOURCE_DIR"/tools/metrics/timing.sh stop dependency_install

  # `go build ./... && go test ./...` against projects/go, via tools/run-go.sh (spec §6.8). Always
  # installs the pinned `go_version` from scratch (go.dev/dl) rather than relying on whatever Go
  # happens to be preinstalled on the stack — this is what makes GO-B02's toolchain-drift scenario
  # meaningful (seed and measure can genuinely run different, real Go versions).
  go_build:
    inputs:
    - go_version: "1.22.0"
    steps:
    - script@1.2.1:
        title: "go build + test"
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/run-go.sh "$go_version"

  # `cargo build && cargo test` against projects/rust, via tools/run-rust.sh (spec §6.9). Always
  # installs the pinned `toolchain` from scratch via rustup rather than relying on whatever's
  # preinstalled on the stack — this is what makes RS-B02's toolchain-drift scenario meaningful.
  rust_build:
    inputs:
    - toolchain: "stable"
    - profile: "release"
    steps:
    - script@1.2.1:
        title: "cargo build + test"
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$BITRISE_SOURCE_DIR"/tools/run-rust.sh "$toolchain" "$profile"
